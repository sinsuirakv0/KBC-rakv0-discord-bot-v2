name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --workspace

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Type-check TypeScript
        run: npm run typecheck

      - name: Check generated protocol types
        run: git diff --exit-code -- apps/discord/src/protocol/generated
