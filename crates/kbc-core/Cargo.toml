[package]
name = "kbc-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
aes = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cipher = { version = "0.4", features = ["alloc", "block-padding"] }
ecb = "0.1"
getrandom = "0.4"
hmac = "0.12"
kbc-protocol = { path = "../kbc-protocol" }
md-5 = "0.10"
num-bigint = "0.4"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny-skia = "0.12"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
unicode-normalization = "0.1"

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "stream"] }

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
